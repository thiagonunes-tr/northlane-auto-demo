name: Validate and deploy

# The deploy step is intentionally gated on `vars.CLOUDFLARE_PROVISIONED`.
# Until the Worker, the D1 database and the Vercel project exist, every gate
# below still runs on every push — a green build with no deploy is the correct
# state for a repository whose cloud resources have not been created yet.
# See README.md, "Provisioning", for what to create and which values to set.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --requirement requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Run deterministic browser tests
        env:
          E2E_MFA_SESSION_SECRET: github-actions-e2e-only-secret-2026
        run: python tests/e2e/full_demo.py

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: test-results/e2e
          if-no-files-found: ignore

      - name: Build Cloudflare application
        run: npm run build

      - name: Build Vercel frontend
        run: npm --prefix vercel-frontend run build

  deploy:
    name: Deploy Worker
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CLOUDFLARE_PROVISIONED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A Worker deployed without a signing secret answers 500 on every
      # authenticated route, which reads as a broken app rather than a missing
      # secret. Refuse to call that a deployment.
      - name: Verify required Worker secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets=$(npx wrangler secret list --name northlane-auto-demo 2>/dev/null || echo '[]')
          echo "$secrets" | grep -q 'MFA_SESSION_SECRET' || {
            echo "::error::MFA_SESSION_SECRET is not set on the Worker."
            echo "Run: npx wrangler secret put MFA_SESSION_SECRET --name northlane-auto-demo"
            exit 1
          }

      - name: Build Cloudflare application
        run: npm run build

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
